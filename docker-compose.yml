services:
  app:
    build: .
    image: txdl-manager
    container_name: txdl-manager
    restart: unless-stopped
    # localhost-only: this app has no authentication
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment:
      # Transmission RPC as seen from inside the container. On Docker Desktop
      # for macOS, host.docker.internal resolves to your Mac.
      TRANSMISSION_RPC_URL: ${TRANSMISSION_RPC_URL:-http://host.docker.internal:9091/transmission/rpc}
      # Optional, if you enabled RPC authentication in Transmission:
      TRANSMISSION_RPC_USERNAME: ${TRANSMISSION_RPC_USERNAME:-}
      TRANSMISSION_RPC_PASSWORD: ${TRANSMISSION_RPC_PASSWORD:-}
      # Host roots (comma-separated) that cover Transmission's download
      # directories. Each must also be bind-mounted at the SAME path below —
      # then any download dir under them works, no path translation needed.
      HOST_DOWNLOAD_ROOTS: ${HOST_DOWNLOAD_ROOTS:-}
      # Default destination preset in the "Move to HDD" dialog.
      MOVE_DESTINATION: ${MOVE_DESTINATION:-}
      # App-local state file (HR group overrides) — bind-mounted below.
      HR_STATE_FILE: /state/hr-state.json
      # Download locations enabled for junk cleanup from the UI — bind-mounted below.
      LOCATIONS_STATE_FILE: /state/locations.json
      ORIGIN: http://localhost:${APP_PORT:-3000}
    volumes:
      # Same-path mounts, kept in sync with HOST_DOWNLOAD_ROOTS above: every
      # root listed there needs a matching line here. Read-write: the app
      # deletes unselected junk files under locations you enable in the UI,
      # pinned inside each torrent's own download dir.
      - /Users/ralim1:/Users/ralim1
      - /Volumes:/Volumes
      # App-local state (HR overrides, enabled locations). Same host dir dev
      # mode writes to, so manual choices survive rebuilds and restarts.
      - ./.data:/state
    extra_hosts:
      # belt-and-braces for linux hosts; Docker Desktop provides this already
      - 'host.docker.internal:host-gateway'
